[project]
name = "openfeed-backend"
version = "0.1.0"
description = "Self-hostable RSS feed aggregator with interest-based relevance ranking"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "feedparser>=6.0.11",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sentence-transformers>=3.4.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openfeed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"